name: Aeth bridge

on:
  push:
    paths:
      - "aeth_bridge/**"
      - "tests/test_aeth_bridge.py"
      - "requirements-aeth-bridge.txt"
      - "scripts/*aeth_bridge*"
      - ".github/workflows/aeth-bridge.yml"
  pull_request:
    paths:
      - "aeth_bridge/**"
      - "tests/test_aeth_bridge.py"
      - "requirements-aeth-bridge.txt"
      - "scripts/*aeth_bridge*"
      - ".github/workflows/aeth-bridge.yml"

jobs:
  contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-aeth-bridge.txt pytest
      - run: python -m pytest tests/test_aeth_bridge.py -q
      - run: python -m aeth_bridge --probe
